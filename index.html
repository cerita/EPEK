<!doctype html>
<html lang="en">

<head>
    <title>EPEK</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description"
        content="A new urban dance team in Austin, TX where dancers can compete, create, and cultivate.">

    <!-- External Resources - Fonts -->
    <link rel="stylesheet" media="screen" href="https://fontlibrary.org/face/glacial-indifference" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Oswald" rel="stylesheet">

    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css"
        integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
    <!-- CSS -->
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <!-- NAV -->
    <nav>
        <img class="epek-icon" src="assets/EPEK-Icon-White.svg" alt="EPEK logo">
    </nav>


    <section id="hero">
        <div id="hero-content">
            <img class="hero-wordmark" src="assets/EPEK-Wordmark-White.svg" alt="EPEK">
            <div class="hero-divide"></div>
            <h2 class="hero-tagline">Austin's Premiere Urban Dance Team</h2>
        </div>
    </section>


    <!-- ABOUT -->
    <section id="about">
        <div id="epek-bio">
            <p>EPEK was born from a passion for dance shared by four working professional friends and their desire
                to
                create a community where dancers can <span class="epek-mantra">compete,
                    create, cultivate</span>, and mark a new epoch in people’s
                lives.</p>
            <br>
            <p>With this mission, we are proud to introduce EPEK.</p>
        </div>
    </section>


    <!-- VIDEO -->
    <section id="video">
        <div class="video-wrapper">
            <div class="EPEK-video">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/PNCQUgJHcwE" frameborder="0"
                    allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>
    </section>



    <!-- FOOTER -->
    <footer>
        <img src="assets/EPEK-Logo-White.svg" alt="EPEK logo" class="footer-icon flex-footer-col">
        <div class="social-menu">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
        </div>
    </footer>

    <div class="icon-bar">
        <a href="#" class="facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="#" class="twitter"><i class="fab fa-twitter"></i></a>
        <a href="#" class="instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" class="youtube"><i class="fab fa-youtube"></i></a>
    </div>

    </div>

</body>

</html>
